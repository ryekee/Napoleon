name: Napoleon
options:
  bundleIdPrefix: com.napoleon
  deploymentTarget: { macOS: "14.0" }
  # i18n：英文是开发语言（源码里的字符串字面量就是英文，同时充当 String Catalog 的 key），
  # 其余三种语言在 Resources/Localizable.xcstrings 里翻译。
  developmentLanguage: en
knownRegions: [en, zh-Hans, zh-Hant, ja]
settings:
  base:
    CODE_SIGN_IDENTITY: "com.ryekee.napoleon"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  Napoleon:
    type: application
    platform: macOS
    sources:
      - Sources/Napoleon
      - Resources/Assets.xcassets       # App 图标（AppIcon.appiconset）
      - Resources/Localizable.xcstrings # i18n：en / zh-Hans / zh-Hant / ja
    dependencies: [{ target: NapoleonCore }]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Resources/Info.plist        # 由下方 properties 生成
      properties:
        LSUIElement: true
        CFBundleDevelopmentRegion: en
        # 版本号显式写在这里（不再吃 XcodeGen 的 1.0/1 默认值）——About 页展示它，
        # 检查更新拿它跟 GitHub Release 的 tag 比对。发版时改这两行。
        CFBundleShortVersionString: "0.2.0"   # 面向用户的版本号，对应 Release tag v0.2.0
        # CFBundleVersion（构建号）由下面的 preBuildScripts 在每次构建时写成 git 提交数。这里的
        # 值只是占位；拿不到 git（比如下载 zip 源码构建）时它会原样留在产物里。
        CFBundleVersion: "0"
        NSHumanReadableCopyright: "© 2026 Ryekee"
    # 构建号 = git 提交数。Xcode 不会自动递增构建号，写死在 project.yml 里则永远是同一个数字，
    # 「我跑的是不是最新构建」就无从判断。用提交数是因为它单调递增、可复现（同一个 commit 永远
    # 得到同一个构建号）、且不需要往仓库里回写任何东西。
    #
    # 改的是 XcodeGen 生成的**源** Info.plist（`Resources/Info.plist`，已 gitignore，不会污染
    # 仓库），而不是产物里的那份：产物 plist 要到打包阶段才存在，postCompile 时改会报
    # 「Entry Does Not Exist」；而 postBuild 又在代码签名**之后**，那时改包内容会直接让签名失效。
    # 放在 preBuild 改源文件，后续的 Process Info.plist 自然带上新值，签名也照常覆盖它。
    preBuildScripts:
      - name: Stamp build number from git
        basedOnDependencyAnalysis: false   # 无输出产物，本来就该每次构建都跑
        script: |
          set -eu
          PLIST="$SRCROOT/Resources/Info.plist"

          # 拿不到 git 就**不写**，保留占位值。原先是 `|| echo 0`，那会让构建号从 5 静默倒退到
          # 0——构建号倒退对 LaunchServices 的「同一 bundle 哪份更新」判定有影响，将来接上
          # Sparkle 之后更是直接变成一个谁都升不上去的死版本。宁可不盖章也不要盖一个错的。
          if ! BUILD=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null); then
            echo "warning: 不在 git 仓库里（或没有 git），CFBundleVersion 保持占位值不变"
            exit 0
          fi

          # 浅克隆是最坏的一种：不报错、不为零，安安静静给出一个错的小数字（--depth 1 就是 1）。
          # 这种情况必须响亮地失败——发布构建绝不该带着一个错的构建号出门。
          if [ "$(git -C "$SRCROOT" rev-parse --is-shallow-repository)" = "true" ]; then
            echo "error: 浅克隆下 git 提交数不是真实构建号；请用完整克隆构建" >&2
            exit 1
          fi

          # 值没变就不写：PlistBuddy 无条件写会改 mtime，害得每次增量构建都重跑
          # Process Info.plist 并重新签名。
          CURRENT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" 2>/dev/null || echo "")
          if [ "$CURRENT" != "$BUILD" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          fi
    scheme:
      testTargets: [NapoleonTests]      # 让 `Napoleon` scheme 的 test action 挂上 App 层单测
  NapoleonCore:
    type: framework
    platform: macOS
    sources: [Sources/NapoleonCore]
    scheme:
      testTargets: [NapoleonCoreTests]   # 让 `NapoleonCore` scheme 的 test action 挂上测试
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES     # 无 info.path 时需显式生成，否则 framework 缺 Info.plist 导致签名失败
  NapoleonCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/NapoleonCoreTests]
    dependencies: [{ target: NapoleonCore }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES     # 同上，测试 bundle 也需要 Info.plist
  NapoleonTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/NapoleonTests]
    dependencies: [{ target: Napoleon }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
